name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Lean
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check Lean source requirements (module headers, 10,000-line cap)
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@v1
        with:
          build: true
          lint: false
          mk_all-check: false

  comparator:
    name: Check Challenge against Solution (lake comparator)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          build: false
          lint: false
          mk_all-check: false
      - name: Install bubblewrap for lake comparator's sandbox
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the toolchain's lake comparator
        run: ./scripts/verify-comparator.sh

      - name: Debug - print compared definitions from both sides
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/dbg"
          for side in Challenge Solution; do
            cat > "$RUNNER_TEMP/dbg/$side.lean" <<EOF
          import $side
          import Lean
          open Lean in
          run_cmd do
            for n in [\`LHYUpper.ratio, \`LHYUpper.g0, \`LHYUpper.cLHY, \`LHYUpper.e0P, \`LHYUpper.thermo, \`LHYUpper.gfun] do
              let c ← getConstInfo n
              logInfo m!"{n} hints={match c.hints with | .opaque => "opaque" | .abbrev => "abbrev" | .regular h => toString h} lvls={c.levelParams} typeHash={c.type.hash} valueHash={c.value?.map (·.hash)}"
          set_option pp.all true in
          #print LHYUpper.ratio
          EOF
            sed -i 's/^          //' "$RUNNER_TEMP/dbg/$side.lean"
            echo "=========== $side"; lake env lean "$RUNNER_TEMP/dbg/$side.lean" || true
          done

  metadata:
    name: Check formalization.yaml (fails while TEMPLATE values remain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: ruby scripts/validate-formalization.rb

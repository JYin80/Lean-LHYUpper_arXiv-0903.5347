# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4, for Palomar (https://palomar-registry.org/).
# Values that still begin with "TEMPLATE:" are facts only the author can state; they must be
# replaced before submitting (scripts/validate-formalization.rb lists them).
version: "v0.4"

project:
  name: "The second order (Lee–Huang–Yang) upper bound for the ground state energy of a dilute Bose gas"
  description: >-
    A Lean 4 / Mathlib proof of the main result of Yau and Yin, "The Second Order Upper Bound
    for the Ground Energy of a Bose Gas" (J. Stat. Phys. 136 (2009), arXiv:0903.5347). For N
    bosons in the box [0, L]^3 with periodic boundary condition, interacting through a pair
    potential V that is a nonnegative even Schwartz function, not identically zero and small
    enough that the Born series converges, the ground state energy per particle e_0 satisfies
    limsup_{rho -> 0+} limsup_{L -> infinity, N/L^3 -> rho}
    (e_0 - g_0 rho) / (g_0^{5/2} rho^{3/2}) <= 16/(15 pi^2), where g_0 = int V(1 - w) = 4 pi a,
    1 - w is the zero-energy scattering solution and a is the scattering length. This is the
    upper bound in the Lee–Huang–Yang formula e_0 = 4 pi a rho (1 + (128/(15 sqrt(pi)))
    (rho a^3)^{1/2} + ...). The formalization also proves that the zero-energy scattering
    solution exists and is unique under these hypotheses, that the Gaussian potential satisfies
    them, and that the statement is not vacuous (g_0 > 0, the energies are nonnegative, the
    filter of the thermodynamic limit is proper). Everything the paper takes as known
    (scattering theory, Riemann sums on the dual lattice, the variational principle, the passage
    between periodic and Dirichlet boundary conditions) is proved in the library from Mathlib.
  authors:
    - "Jun Yin"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jun Yin"


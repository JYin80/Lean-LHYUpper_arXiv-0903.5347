    - source: "Section 2, the zero-energy scattering solution"
      lean: "LHYUpper.scatteringSolution_existsUnique"
      module: "Challenge"
      status: "proved"
      note: "The paper takes existence as known. Proved by LHYUpper.scattering_exists_unique."
    - source: "Hypotheses of Theorem 2.1"

    - source: "Section 2, the thermodynamic limit"
      lean: "LHYUpper.thermo_proper"
      module: "Challenge"
      status: "proved"
      note: "Consistency check: the filter of the inner upper limit is proper. Proved by LHYUpper.thermo_neBot."


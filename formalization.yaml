      module: "Challenge"
      status: "proved"
      note: "Consistency check, not a result of the paper: the Gaussian satisfies PotentialHyp. Proved by LHYUpper.scat_gaussian_potentialHyp."
    - source: "Section 2, g_0 = 4 pi a > 0"
      lean: "LHYUpper.g0_pos"
      module: "Challenge"

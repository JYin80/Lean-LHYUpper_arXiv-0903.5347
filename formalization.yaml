        Challenge/Solution files for Palomar were also written with Claude.
      cost:
        wall_time: "about 55 hours elapsed (2026-11-16 to 2026-11-19; the work repository has 138 commits, in 30 distinct clock hours)"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    The mathematical source is a paper by Horng-Tzer Yau and Jun Yin. The Lean proofs were
    produced by AI agents; the statements of the main theorem and of the definitions it uses
    were fixed and checked by Jun Yin against the paper.

fidelity:
  divergences: >-
    (1) e_0^P is defined as an infimum over finitely supported normalized occupation-number
    states rather than as inf spec H / N. (2) "Smooth with fast decay" is read as Schwartz,
    "symmetric" as even, and the smallness of V as sup_x int V(y)/(4 pi |x - y|) dy < 1; V not
    identically zero is added. (3) The scattering solution is a hypothesis of the main
    statement; its existence and uniqueness are proved separately. (4) The interaction of (2.1)
    uses the Fourier transform of V on R^3 at the lattice momenta, which in position space is
    the periodization sum_n V(x + nL); (2.1) has no factor 1/2, so each pair is counted twice.
    (5) Upper limits are taken in EReal; the small boxes of Sections 2 and 3 run along
    rho_N = N^{-8/17}. (6) A number of intermediate statements and proof steps of the arXiv
    version are corrected; none changes Theorem 2.1. Details: docs/PAPER-VS-LEAN.md, Section 3.


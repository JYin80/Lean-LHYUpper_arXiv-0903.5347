      - "C. N. Yang"
    type: "paper"
    location: "Phys. Rev. 106 (1957), 1135-1145"
    relationship: "background"
    note: "The physical prediction of the second order term; not used in the proof."

related_formalizations: []

status:
  scope: >-
    Formalized: Theorem 2.1 of the paper in full (thermodynamic limit, periodic boundary
    condition), through Theorem 3.1, Theorem 2.2, Lemma 2.2, Lemma 2.1 and the duplication
    step; existence and uniqueness of the zero-energy scattering solution; the variational
    principle; nonnegativity of the Hamiltonian on finitely supported states. In the statement,
    e_0 is the infimum of <Psi, H Psi>/N over finitely supported normalized N-particle states
    in the occupation-number basis, with values in EReal; it is at least inf spec H / N, so the
    bound implies the paper's, but neither this inequality nor the equality of the two is
    formalized. Not formalized: the remarks after Theorem 2.1 (the same bound with Dirichlet
    boundary condition in the thermodynamic limit, and an error bound for (2.2)); Corollary 5.1
    as an iterated limit; the heuristic material of the introduction and of Section 3.1.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

